services:
  model:
    image: ghcr.io/ggml-org/llama.cpp@sha256:9fbaa06d7f4449e2ae0d02b40e0431f7c212dcf231c9e3a7777a6afc2cc8f312
    cpus: ${THREADS}
    mem_limit: 10g
    volumes:
      - ${MODEL_PATH}:/models/model.gguf:ro
    command:
      - --model
      - /models/model.gguf
      - --alias
      - local-model
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --threads
      - ${THREADS}
      - --ctx-size
      - ${CONTEXT_SIZE}
      - --parallel
      - '1'
      - --temp
      - '0'
      - --seed
      - '42'
      - --n-gpu-layers
      - '0'
      - --jinja
      - --reasoning
      - 'off'
      - --no-webui
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 5s
      start_period: 5m
      retries: 12
  magpie:
    image: ghcr.io/yetone/magpie@sha256:9febe18ffd2f0fb7b59e9dad6d7653e927276e11fc35b33ab490a0bf44f495e0
    mem_limit: 512m
    ports:
      - 127.0.0.1:${GATEWAY_PORT}:3425
    environment:
      MAGPIE_ADDR: 0.0.0.0:3425
    volumes:
      - magpie:/config
    depends_on:
      model:
        condition: service_healthy
    healthcheck:
      test: [CMD, magpie, healthcheck]
      interval: 5s
      retries: 12
volumes:
  magpie:
